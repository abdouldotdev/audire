name: lisiere
description: Lecteur EPUB et PDF local avec narration et suivi de lecture.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  adaptive_platform_ui: 0.1.111
  flutter_onnxruntime: 1.8.5
  lisiere_native_tts:
    path: packages/lisiere_native_tts
  archive: ^4.0.7
  xml: ^6.6.1
  html: ^0.15.6
  crypto: ^3.0.6
  file_picker: ^10.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  just_audio: ^0.10.5
  audio_session: ^0.2.2
  audio_service: ^0.18.18
  unorm_dart: ^0.3.0
  phonemize: 1.0.0
  scrollable_positioned_list: ^0.3.8
  page_flip: ^0.2.5+1
  pdfrx: 2.4.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/demo.epub
    - assets/onboarding-landscape.png
